<head>

    <style>
        /* APOLLO ADLUX PALETTE: Teal #0077A8 | Gold #BFA073 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {

            background-repeat: no-repeat;
            line-height: 1.6;

        /* TRANSPARENT HEADER */
        .header {
            text-align: center;
            background: transparent; 
            padding: 10px 15px; 
            border-radius: 15px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .logo-container { margin-bottom: 5px; }
        
        .hospital-logo {
            width: 100%;
            max-width: 350px;
            max-height: 180px;
            object-fit: contain; 
            margin: 0 auto;
            display: block;
            filter: drop-shadow(0px 0px 10px rgba(255, 255, 255, 0.9)); 
        }
        
        .hospital-subtitle {
            font-size: 1.4rem;
            color: #0077A8;
            font-weight: 800;
            margin: 0;
            text-shadow: 0px 0px 15px rgba(255, 255, 255, 1), 0px 0px 5px rgba(255, 255, 255, 1);
        }
        
        /* Hit Counter */
        .hit-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #BFA073;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;

            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 10;
        }
        
        /* Language Selector */
        .language-selector {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .language-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #0077A8;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            min-width: 70px;
            color: #0077A8;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            backdrop-filter: blur(4px);
        }
        
        .language-btn:hover { background: #f0f7f9; }
        .language-btn.active { background: #0077A8; color: white; }
        
        /* Search Section */
        .search-container {
            margin: 15px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            font-size: 1.1rem;
            border: 2px solid #0077A8;
            border-radius: 25px;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 10px rgba(0, 119, 168, 0.2);
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        
        .search-box:focus {
            border-color: #BFA073;
            box-shadow: 0 2px 15px rgba(191, 160, 115, 0.4);
        }
        
        .search-hint {
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-top: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        /* Departments Grid */
        .departments-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .department-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            backdrop-filter: blur(6px);
        }
        
        .department-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 119, 168, 0.4);
            border-color: #0077A8;
            background: rgba(255, 255, 255, 1);
        }
        
        .department-box:active { transform: scale(0.98); }
        
        .department-icon { font-size: 2.5rem; margin-bottom: 10px; }
        
        .department-box h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #0077A8;
            font-weight: bold;
        }
        
        .department-location {
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
            margin-bottom: 5px;
            background: #BFA073;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
        }
        
        .department-box p { font-size: 0.9rem; color: #444; line-height: 1.3; }
        .department-box.hidden { display: none; }
        
        .no-results {
            text-align: center;
            color: white;
            background: rgba(220, 53, 69, 0.9);
            padding: 10px;
            border-radius: 10px;
            font-size: 1.2rem;
            margin: 40px auto;
            display: none;
            width: fit-content;
            backdrop-filter: blur(4px);
        }
        
        /* Back to top */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0077A8;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            border: none;
        }
        
        .back-to-top:hover { background: #BFA073; transform: translateY(-2px); }
        
        /* Responsive */
        @media (max-width: 480px) {
            .departments-grid { grid-template-columns: repeat(1, 1fr); gap: 12px; }
            .department-box { padding: 20px 15px; min-height: 130px; }
            .department-icon { font-size: 2.2rem; }
            .department-box h3 { font-size: 1.1rem; }
            .hospital-subtitle { font-size: 1.2rem; }
            .hospital-logo { max-height: 130px; max-width: 250px; }
            .language-btn { padding: 6px 10px; font-size: 0.85rem; min-width: 60px; }
            .hit-counter { position: static; margin: 5px auto; width: fit-content; top: auto; right: auto; }
        }
        
        @media (min-width: 768px) {
            .departments-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 800px; margin: 0 auto 20px; }
            body { max-width: 1200px; }
            .hospital-logo { max-height: 200px; max-width: 400px; }
            .hospital-subtitle { font-size: 1.6rem; }
        }
    </style>

</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="hit-counter" id="hitCounter">
            <span class="hit-counter-icon">👥</span>

        </div>
        
        <div class="logo-container">

        <div class="hospital-info">
            <div class="hospital-subtitle" id="subtitleText">Way Finder Navigation System</div>

    <!-- Language Selector -->
    <div class="language-selector">
        <button class="language-btn active" data-lang="en">English</button>
        <button class="language-btn" data-lang="hi">हिंदी</button>
        <button class="language-btn" data-lang="ml">മലയാളം</button>
        <button class="language-btn" data-lang="ta">தமிழ்</button>
        <button class="language-btn" data-lang="ar">العربية</button>

    <!-- Search -->
    <div class="search-container">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Type department name...">
        <div class="search-hint" id="searchHintText">Type to filter departments</div>
    </div>

    <div id="noResults" class="no-results">
        No departments found. Try different keywords.
    </div>

    <!-- Departments Grid -->
    <div class="departments-grid" id="departmentsGrid">
        
        <!-- Admission Department -->
        <div class="department-box" data-name="admission" data-keywords="admission register patient billing help desk">
            <div class="department-icon">📝</div>
            <h3 id="deptNameAdmission">Admission</h3>
            <p class="department-location" id="deptFloorAdmission">Ground Floor</p>
            <p id="deptDescAdmission">Patient admission & registration</p>
        </div>

        <!-- Insurance Department (NEW) -->
        <div class="department-box" data-name="insurance" data-keywords="insurance claim policy health insurance desk">
            <div class="department-icon">🛡️</div>
            <h3 id="deptNameInsurance">Insurance</h3>
            <p class="department-location" id="deptFloorInsurance">Ground Floor</p>
            <p id="deptDescInsurance">Health insurance & claims</p>
        </div>

    </div>

    <button class="back-to-top" id="backToTop" onclick="scrollToTop()" aria-label="Back to top">↑</button>

    <script>
        // HIT COUNTER
        async function initializeHitCounter() {
            if (database) {
                try {
                    if (!sessionStorage.getItem('visitCounted')) {
                        const counterRef = database.ref('visitCounter');
                        const snapshot = await counterRef.once('value');
                        let currentCount = snapshot.val() || 0;
                        currentCount++;
                        await counterRef.set(currentCount);
                        sessionStorage.setItem('visitCounted', 'true');
                        localStorage.setItem('lastFirebaseCount', currentCount.toString());
                        document.getElementById('counterValue').textContent = formatNumber(currentCount);
                    } else {
                        let currentCount = (await database.ref('visitCounter').once('value')).val() || 0;
                        document.getElementById('counterValue').textContent = formatNumber(currentCount);
                    }
                } catch (error) {
                    fallbackLocalCounter();
                }
            } else {
                fallbackLocalCounter();
            }
        }
        
        function fallbackLocalCounter() {
            if (!sessionStorage.getItem('visitCounted')) {
                let count = localStorage.getItem('apolloVisits') || 0;
                count = parseInt(count) + 1;
                localStorage.setItem('apolloVisits', count);
                sessionStorage.setItem('visitCounted', 'true');
                document.getElementById('counterValue').textContent = formatNumber(count);
                document.getElementById('hitCounter').style.backgroundColor = '#6c757d';
            } else {
                let count = localStorage.getItem('apolloVisits') || 0;
                document.getElementById('counterValue').textContent = formatNumber(parseInt(count));
            }
        }
        
        function formatNumber(num) {
            num = parseInt(num);
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num.toString();
        }

        // TRANSLATIONS
        const translations = {
            en: {
                subtitle: "Way Finder Navigation System",
                searchPlaceholder: "🔍 Type department name...",
                searchHint: "Type to filter departments", 
                noResults: "No departments found. Try different keywords.",
                dept: {
                    admission: { name: "Admission", location: "Ground Floor", description: "Patient admission & registration" },
                    insurance: { name: "Insurance", location: "Ground Floor", description: "Health insurance & claims" }
                }
            },
            hi: {
                subtitle: "वे फाइंडर नेविगेशन सिस्टम",
                searchPlaceholder: "🔍 विभाग का नाम टाइप करें...", 
                searchHint: "विभागों को फिल्टर करने के लिए टाइप करें",
                noResults: "कोई विभाग नहीं मिला।", 
                dept: {
                    admission: { name: "प्रवेश (Admission)", location: "ग्राउंड फ्लोर", description: "रोगी प्रवेश और पंजीकरण" },
                    insurance: { name: "बीमा (Insurance)", location: "ग्राउंड फ्लोर", description: "स्वास्थ्य बीमा और दावे" }
                }
            },
            ml: {
                subtitle: "വേ ഫൈൻഡർ നാവിഗേഷൻ സിസ്റ്റം",
                searchPlaceholder: "🔍 വകുപ്പ് പേര് ടൈപ്പ് ചെയ്യുക...", 
                searchHint: "ഫിൽട്ടർ ചെയ്യാൻ ടൈപ്പ് ചെയ്യുക",
                noResults: "വകുപ്പുകൾ കണ്ടെത്തിയില്ല.", 
                dept: {
                    admission: { name: "അഡ്മിഷൻ", location: "ഗ്രൗണ്ട് ഫ്ലോർ", description: "രോഗി പ്രവേശനവും രജിസ്ട്രേഷനും" },
                    insurance: { name: "ഇൻഷുറൻസ്", location: "ഗ്രൗണ്ട് ഫ്ലോർ", description: "ആരോഗ്യ ഇൻഷുറൻസും ക്ലെയിമുകളും" }
                }
            },
            ta: {
                subtitle: "வழிகாட்டி அமைப்பு",
                searchPlaceholder: "🔍 துறையின் பெயரை உள்ளிடவும்...", 
                searchHint: "துறைகளை வடிகட்ட தட்டச்சு செய்யவும்",
                noResults: "துறைகள் எதுவும் கிடைக்கவில்லை.", 
                dept: {
                    admission: { name: "சேர்க்கை", location: "தரை தளம்", description: "நோயாளி சேர்க்கை மற்றும் பதிவு" },
                    insurance: { name: "காப்பீடு", location: "தரை தளம்", description: "சுகாதார காப்பீடு மற்றும் உரிமைகோரல்கள்" }
                }
            },
            ar: {
                subtitle: "نظام الملاحة للعثور على الطريق",
                searchPlaceholder: "🔍 اكتب اسم القسم...", 
                searchHint: "اكتب لتصفية الأقسام",
                noResults: "لم يتم العثور على أقسام.", 
                dept: {
                    admission: { name: "القبول", location: "الطابق الأرضي", description: "قبول المرضى والتسجيل" },
                    insurance: { name: "التأمين", location: "الطابق الأرضي", description: "التأمين الصحي والمطالبات" }
                }
            }
        };

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', function() {
            initializeHitCounter();
            initializeLanguage();
            initializeSearch();
            initializeBackToTop();
        });

        function initializeLanguage() {
            const savedLanguage = localStorage.getItem('selectedLanguage') || 'en';
            const languageBtns = document.querySelectorAll('.language-btn');
            
            languageBtns.forEach(function(btn) {
                if (btn.getAttribute('data-lang') === savedLanguage) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
                
                btn.addEventListener('click', function() {
                    const lang = this.getAttribute('data-lang');
                    changeLanguage(lang);
                    
                    languageBtns.forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                });
            });
            
            changeLanguage(savedLanguage);
        }

        function changeLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            const t = translations[lang];
            
            document.getElementById('subtitleText').textContent = t.subtitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('searchHintText').textContent = t.searchHint;
            document.getElementById('noResults').textContent = t.noResults;
            
            // Update Admission
            const admission = t.dept.admission;
            document.getElementById('deptNameAdmission').textContent = admission.name;
            document.getElementById('deptFloorAdmission').textContent = admission.location;
            document.getElementById('deptDescAdmission').textContent = admission.description;

            // Update Insurance
            const insurance = t.dept.insurance;
            document.getElementById('deptNameInsurance').textContent = insurance.name;
            document.getElementById('deptFloorInsurance').textContent = insurance.location;
            document.getElementById('deptDescInsurance').textContent = insurance.description;
        }

        function initializeSearch() {
            const searchInput = document.getElementById('searchInput');
            const noResults = document.getElementById('noResults');
            const departmentBoxes = document.querySelectorAll('.department-box');

            let searchTimeout;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(function() {
                    const searchTerm = this.value.toLowerCase().trim();
                    let visibleCount = 0;

                    departmentBoxes.forEach(function(box) {
                        const departmentName = box.getAttribute('data-name').toLowerCase();
                        const keywords = box.getAttribute('data-keywords').toLowerCase();
                        
                        if (searchTerm === '' || departmentName.includes(searchTerm) || keywords.includes(searchTerm)) {
                            box.classList.remove('hidden');
                            visibleCount++;
                        } else {
                            box.classList.add('hidden');
                        }
                    });

                    if (visibleCount === 0 && searchTerm !== '') {
                        noResults.style.display = 'block';
                    } else {
                        noResults.style.display = 'none';
                    }
                }.bind(this), 300);
            });

            // Department click handler
            departmentBoxes.forEach(function(box) {
                box.addEventListener('click', function() {
                    const departmentName = this.getAttribute('data-name');
                    
                    if (departmentName === 'admission') {
                        window.location.href = 'admission.html';
                    } else if (departmentName === 'insurance') {
                        window.location.href = 'insurance.html';
                    } else {
                        alert('Directions for ' + departmentName + ' coming soon!');
                    }
                });
            });
        }

        function initializeBackToTop() {
            const backToTopBtn = document.getElementById('backToTop');
            
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    backToTopBtn.style.display = 'flex';
                } else {
                    backToTopBtn.style.display = 'none';
                }
            });
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        window.scrollToTop = scrollToTop;
    </script>
</body>
